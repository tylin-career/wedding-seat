<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>林鼎元 ♥ 陳蓓蓓 婚宴尋座</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#15203B; --card:#223354; --gold:#F2C94C; --gold-deep:#D9A93C;
  --ink:#F0EAD8; --muted:#9FAAC7; --line:#3A4C75; --rose:#E4647A; --fox:#E8924A;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Noto Sans TC',system-ui,sans-serif;color:var(--ink);background-color:#16213E;
  background-image:
    radial-gradient(1px 1px at 23px 41px, rgba(255,255,255,.55) 50%, transparent 51%),
    radial-gradient(1px 1px at 117px 156px, rgba(242,201,76,.5) 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 70px 93px, rgba(255,255,255,.4) 50%, transparent 51%),
    radial-gradient(1px 1px at 161px 49px, rgba(255,255,255,.45) 50%, transparent 51%),
    radial-gradient(1.3px 1.3px at 51px 178px, rgba(242,201,76,.55) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 201px 87px, rgba(255,255,255,.6) 50%, transparent 51%),
    radial-gradient(1px 1px at 137px 226px, rgba(255,255,255,.4) 50%, transparent 51%),
    radial-gradient(1.6px 1.6px at 285px 169px, rgba(242,201,76,.65) 50%, transparent 51%),
    linear-gradient(115deg, transparent 0 38%, rgba(255,255,255,.035) 47% 53%, transparent 62% 100%),
    radial-gradient(circle at 18% 6%, rgba(242,201,76,.07) 0 150px, transparent 151px),
    radial-gradient(circle at 88% 94%, rgba(228,100,122,.08) 0 170px, transparent 171px),
    linear-gradient(180deg,#121A30 0%,#1B2A4A 55%,#22335A 100%);
  background-size:213px 213px,259px 259px,233px 233px,307px 307px,283px 283px,353px 353px,331px 331px,401px 401px,100% 100%,100% 100%,100% 100%,100% 100%;
  background-repeat:repeat,repeat,repeat,repeat,repeat,repeat,repeat,repeat,no-repeat,no-repeat,no-repeat,no-repeat;}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(1.8px 1.8px at 83px 67px, rgba(255,255,255,.9) 50%, transparent 51%),
    radial-gradient(1.6px 1.6px at 247px 191px, rgba(242,201,76,.9) 50%, transparent 51%),
    radial-gradient(2px 2px at 173px 293px, rgba(255,255,255,.8) 50%, transparent 51%);
  background-size:367px 367px,431px 431px,499px 499px;background-repeat:repeat;
  animation:twinkle 4.5s ease-in-out infinite alternate;}
@keyframes twinkle{from{opacity:.25}to{opacity:1}}
.wrap{max-width:520px;margin:0 auto;padding:26px 20px 40px;min-height:100%;display:flex;flex-direction:column;position:relative;z-index:1}
.serif{font-family:'Noto Serif TC',serif}
/* ---------- landing ---------- */
.hero{text-align:center;margin:6px 0 20px}
.hero .date{display:flex;align-items:center;justify-content:center;gap:12px;font-size:13px;color:var(--gold);font-weight:500}
.hero .date .dt{letter-spacing:.35em;text-indent:.35em}
.hero .date .spark{font-size:10px;opacity:.95}
.hero h1{font-size:37px;font-weight:700;margin:12px 0 8px;letter-spacing:.1em;text-indent:.1em;color:#F2C94C;
  background:linear-gradient(180deg,#FFFDF4 0%,#F7E3A4 45%,#E8B844 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero h1 .amp{font-size:23px;margin:0 7px;font-weight:500;font-style:italic;letter-spacing:0}
.hero .venue{display:flex;align-items:center;justify-content:center;gap:14px;font-size:14px;color:#BCC8EA;letter-spacing:.18em;text-indent:.18em}
.hero .venue::before,.hero .venue::after{content:"";width:36px;height:1px;flex:none}
.hero .venue::before{background:linear-gradient(90deg,transparent,#5B6FA3)}
.hero .venue::after{background:linear-gradient(270deg,transparent,#5B6FA3)}
.hero .venue-en{margin-top:7px;font-size:10px;letter-spacing:.34em;text-indent:.34em;color:#7E89A8}
.scene{display:block;width:100%;max-width:340px;margin:10px auto 0}
.lead{text-align:center;font-size:16px;margin:0 0 14px;color:var(--ink);font-weight:500}
.searchbox{position:relative}
.searchbox input{width:100%;font-size:18px;padding:15px 18px 15px 48px;border:1.5px solid var(--line);
  border-radius:14px;background:#1D2C4F;color:var(--ink);outline:none;font-family:inherit;
  box-shadow:0 4px 18px rgba(0,0,0,.25)}
.searchbox input::placeholder{color:#7E89A8}
.searchbox input:focus{border-color:var(--gold)}
.searchbox .icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}
.sugg{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:0 8px 26px rgba(0,0,0,.3);display:none}
.sugg.show{display:block}
.sugg button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:13px 16px;
  border:none;background:none;font-family:inherit;font-size:16px;color:var(--ink);cursor:pointer;text-align:left}
.sugg button + button{border-top:1px solid #314465}
.sugg button:active{background:#2A3D63}
.sugg .who{font-weight:500}
.sugg .badge{display:inline-block;font-size:11px;color:#1B2A4A;background:var(--gold);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:1px;font-weight:700}
.sugg .where{font-size:13px;color:var(--muted);white-space:nowrap;margin-left:12px}
.sugg .none{padding:14px 16px;font-size:14px;color:var(--muted)}
.linebar{margin-top:auto;padding-top:28px;text-align:center}
.linebtn{display:inline-flex;align-items:center;gap:8px;background:#06C755;color:#fff;font-weight:500;
  font-size:15px;padding:11px 22px;border-radius:999px;text-decoration:none;box-shadow:0 3px 12px rgba(6,199,85,.3)}
.linebtn-result{align-self:center;margin-top:16px}
.foot{margin-top:14px;font-size:12px;color:var(--muted);text-align:center;line-height:1.9}
/* ---------- result ---------- */
.back{display:inline-flex;align-items:center;gap:6px;border:none;background:none;color:var(--muted);
  font-size:14px;font-family:inherit;cursor:pointer;padding:4px 0;margin-bottom:6px}
.resCard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px;text-align:center;
  box-shadow:0 8px 28px rgba(0,0,0,.3)}
.resCard .greet{font-size:15px;color:var(--muted)}
.resCard .greet b{color:#fff;font-weight:700;font-size:17px}
.resCard .tableNo{font-size:40px;font-weight:700;color:var(--gold);margin:6px 0 2px;letter-spacing:.04em}
.resCard .tableName{display:inline-block;font-size:14px;color:var(--gold);border:1px solid var(--gold-deep);
  border-radius:999px;padding:3px 14px;margin-top:2px;opacity:.95}
.resCard .walk{font-size:13px;color:var(--muted);margin-top:10px}
.mapBox{margin-top:14px;background:#18233F;border:1px solid var(--line);border-radius:18px;overflow:hidden;
  box-shadow:0 8px 28px rgba(0,0,0,.3);position:relative}
.mapBox svg{display:block;width:100%;height:auto;touch-action:none;user-select:none}
.ctrls{display:flex;gap:12px;margin-top:16px}
.ctrls button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  font-family:inherit;font-size:16px;font-weight:700;padding:15px 0;border-radius:14px;cursor:pointer;
  transition:transform .08s}
.ctrls button:active{transform:scale(0.97)}
.ctrls button svg{flex:none}
.btnPrimary{background:var(--gold);color:#1B2A4A;border:none;box-shadow:0 4px 16px rgba(242,201,76,.35)}
.btnGhost{background:rgba(255,255,255,.04);color:var(--ink);border:1.5px solid var(--line)}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.7}
.view{display:none}
.view.active{display:flex;flex-direction:column;flex:1}
@media (min-width:560px){ .hero h1{font-size:44px} }
</style>
</head>
<body>
<div class="wrap">

<!-- ============ 搜尋頁 ============ -->
<div class="view active" id="viewSearch">
  <div class="hero">
    <div class="date"><span class="spark">✦</span><span class="dt">2026 · 07 · 18</span><span class="spark">✦</span></div>
    <h1 class="serif">林鼎元<span class="amp serif">&</span>陳蓓蓓</h1>
    <div class="venue">台北士林萬麗酒店 · 宴會廳</div>
    <div class="venue-en">RENAISSANCE TAIPEI SHIHLIN</div>
    <svg class="scene" viewBox="0 0 360 134" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

      </g>

      </g>
      <text x="70" y="131" text-anchor="middle" font-size="9" fill="#7E89A8" style="letter-spacing:2px">B-612</text>
      <g transform="translate(296,95)">
        <circle cy="16" r="17" fill="#8A79AE"/><ellipse cx="-6" cy="20" rx="4.5" ry="2.6" fill="#79689D"/>
        <path d="M9-4q15 1 11.5-13-3 5-8.5 5-7.5 0-3 8z" fill="#E8924A"/><circle cx="20" cy="-15.5" r="2.8" fill="#FFF6EC"/>

    </svg>
  </div>
  <p class="lead serif">歡迎降落，請輸入大名，星圖為您引路</p>
  <div class="searchbox">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="text" inputmode="text" autocomplete="off" placeholder="請輸入您的大名" aria-label="輸入姓名搜尋座位">
  </div>
  <div class="sugg" id="sugg" role="listbox"></div>
  <p class="hint">輸入部分姓名即可，也可輸入桌號或桌名</p>
  <div class="linebar">
    <a class="linebtn" id="lineBtn" href="#" target="_blank" rel="noopener" style="display:none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 5.64 2 10.13c0 4.03 3.55 7.4 8.34 8.04.33.07.77.22.88.5.1.26.07.66.03.92l-.14.86c-.04.26-.2 1 .88.55 1.08-.46 5.84-3.44 7.97-5.89C21.42 13.5 22 11.9 22 10.13 22 5.64 17.52 2 12 2z"/></svg>

<!-- ============ 結果頁 ============ -->

    <div class="greet" id="greet"></div>

    <div class="walk" id="seatInfo" style="color:var(--gold);margin-top:4px"></div>
  </div>
  <div class="mapBox">
    <svg id="map" viewBox="58 245 504 262" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="宴會廳平面圖與前往座位的路線"></svg>

    <button class="btnGhost" id="replayBtn"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>重播路線</button>

</div>

</div>

<script>
/* ================= 設定 ================= */
const CONFIG = {
  lineUrl: "https://lin.ee/TLSvVsS",   // 婚禮官方 LINE 連結，留空則隱藏按鈕
  mPerPt: 0.0858             // PDF pt → 公尺（依舞台 732cm 長邊與 180cm 標準圓桌驗證）

/* ================= 搜尋 ================= */
const norm = s => (s||"").normalize("NFKC").toLowerCase().replace(/[\s()（）:：・·。.，,]/g,"");
const GUESTS = [];
TABLES.forEach(t => {
  const cnt = {};
  t.guests.forEach(g => cnt[g] = (cnt[g]||0)+1);
  Object.entries(cnt).forEach(([g, seats]) => {
    const tokens = new Set([norm(g)]);
    const paren = g.match(/[（(]([^（）()]+)[）)]/); if(paren) tokens.add(norm(paren[1]));
    tokens.add(norm(g.replace(/[（(][^（）()]*[）)]/g,"")));
    const colon = g.split(/[:：]/); if(colon.length>1) tokens.add(norm(colon[colon.length-1]));
    GUESTS.push({name:g, no:t.no, tname:t.name, seats, tokens:[...tokens].filter(Boolean)});
  });
});
function search(qRaw){
  const q = norm(qRaw);
  if(!q) return [];
  const res = [];
  for(const g of GUESTS){
    let best = -1;
    for(const tk of g.tokens){
      if(tk.startsWith(q)) best = Math.max(best, 2);
      else if(tk.includes(q)) best = Math.max(best, 1);
    }
    if(best>0) res.push({type:"guest", score:best, len:g.name.length, ...g});
  }
  for(const t of TABLES){
    if(!t.guests.length) continue;
    if(String(t.no)===q || norm(t.name).includes(q))
      res.push({type:"table", score:3, len:0, no:t.no, tname:t.name, name:"第 "+t.no+" 桌"});
  }
  res.sort((a,b)=> b.score-a.score || a.len-b.len || a.no-b.no);
  return res.slice(0,8);
}

/* ================= Dijkstra 路徑 ================= */
function buildPath(tableNo){
  const ap = GEO.approach[tableNo];
  const C = GEO.corridors;
  const nodeXs = {B:new Set(),M:new Set(),C:new Set(),T:new Set()};
  for(const [a,b,xs] of GEO.links) xs.forEach(x=>{nodeXs[a].add(x); nodeXs[b].add(x);});
  Object.values(GEO.tables) && Object.entries(GEO.approach).forEach(([no,a])=>nodeXs[a.c].add(a.ax));
  nodeXs.B.add(GEO.entrance.x);
  const id=(c,x)=>c+"@"+x, nodes={}, edges={};
  const addEdge=(u,v,w)=>{(edges[u]=edges[u]||[]).push([v,w]);(edges[v]=edges[v]||[]).push([u,w]);};
  for(const c in nodeXs){
    const xs=[...nodeXs[c]].filter(x=>x>=C[c].x0-0.1&&x<=C[c].x1+0.1).sort((a,b)=>a-b);
    xs.forEach((x,i)=>{ nodes[id(c,x)]=[x,C[c].y]; if(i>0) addEdge(id(c,xs[i-1]),id(c,x),(x-xs[i-1])*(GEO.weights[c]||1)); });
  }
  for(const [a,b,xs] of GEO.links) xs.forEach(x=>{ if(nodes[id(a,x)]&&nodes[id(b,x)]) addEdge(id(a,x),id(b,x),Math.abs(C[a].y-C[b].y)); });
  const startId="ENT"; nodes[startId]=[GEO.entrance.x,GEO.entrance.y];
  addEdge(startId,id("B",GEO.entrance.x),GEO.entrance.y-GEO.entrance.joinY);
  const goal=id(ap.c,ap.ax);
  const dist={},prev={},Q=new Set(Object.keys(nodes));
  for(const n of Q) dist[n]=Infinity; dist[startId]=0;
  while(Q.size){
    let u=null,du=Infinity; for(const n of Q) if(dist[n]<du){du=dist[n];u=n;}
    if(u===null||u===goal) break; Q.delete(u);
    for(const [v,w] of (edges[u]||[])) if(Q.has(v)&&du+w<dist[v]){dist[v]=du+w;prev[v]=u;}
  }
  const pts=[]; let cur=goal;
  while(cur){ pts.unshift(nodes[cur]); cur=prev[cur]; }
  ap.tail.forEach(p=>pts.push(p));
  /* 去除共線點 */
  const clean=[pts[0]];
  for(let i=1;i<pts.length-1;i++){
    const [a,b,c]=[clean[clean.length-1],pts[i],pts[i+1]];
    if(Math.abs((b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]))>0.5) clean.push(b);
  }
  clean.push(pts[pts.length-1]);
  return clean;
}
function roundedPathD(pts,r=5){
  if(pts.length<2) return "";
  let d=`M${pts[0][0]} ${pts[0][1]}`;
  for(let i=1;i<pts.length-1;i++){
    const [px,py]=pts[i-1],[cx,cy]=pts[i],[nx,ny]=pts[i+1];
    const v1=[px-cx,py-cy],v2=[nx-cx,ny-cy];
    const l1=Math.hypot(...v1),l2=Math.hypot(...v2);
    const rr=Math.min(r,l1/2,l2/2);
    const p1=[cx+v1[0]/l1*rr,cy+v1[1]/l1*rr],p2=[cx+v2[0]/l2*rr,cy+v2[1]/l2*rr];
    d+=` L${p1[0].toFixed(1)} ${p1[1].toFixed(1)} Q${cx} ${cy} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  const e=pts[pts.length-1];
  d+=` L${e[0]} ${e[1]}`;
  return d;
}

/* ================= 動畫 ================= */
let anim={raf:0};
const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
function setVB(x,y,w,h){map.setAttribute("viewBox",`${x} ${y} ${w} ${h}`);}
function vbOf(){return map.getAttribute("viewBox").split(" ").map(Number);}
const clampVB=(x,y,w,h)=>{
  x=Math.min(Math.max(x,FULL.x-10),FULL.x+FULL.w-w+10);
  y=Math.min(Math.max(y,FULL.y-10),FULL.y+FULL.h-h+10);
  return [x,y,w,h];
};
const ease=t=>t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function animateRoute(targetNo,force){
  cancelAnimationFrame(anim.raf);
  drawBase(targetNo);
  const pts=buildPath(targetNo);
  const d=roundedPathD(pts);
  const route=el("path",{d,fill:"none",stroke:"#F2C94C","stroke-width":3.2,
    "stroke-linecap":"round","stroke-linejoin":"round","stroke-dasharray":"7 5",opacity:.95});
  const dot=el("circle",{r:4.6,fill:"#fff",stroke:"#F2C94C","stroke-width":1.8,opacity:0});
  const L=route.getTotalLength();
  document.getElementById("walkInfo").textContent=
    `從入口出發，約 ${Math.max(5,Math.round(L*CONFIG.mPerPt))} 公尺的小旅行`;
  if(reduceMotion&&!force){ setVB(FULL.x,FULL.y,FULL.w,FULL.h); dot.setAttribute("opacity",1);
    const p=route.getPointAtLength(L); dot.setAttribute("cx",p.x); dot.setAttribute("cy",p.y);
    document.getElementById("walkInfo").textContent+="（點「重播路線」可觀看動畫）"; return; }
  route.setAttribute("stroke-dashoffset",L); route.setAttribute("stroke-dasharray",`${L} ${L}`);
  const Z={w:230,h:230*FULL.h/FULL.w};
  const start=performance.now();
  /* T0 全圖→ T1 鏡頭推近入口→ DEPART 在入口停頓脈動→ T2 沿線前進→ HOLD 抵達→ T3 拉回 */
  const T0=700, T1=900, DEPART=750, T2=Math.min(7000,Math.max(3800,L*14)), HOLD=900, T3=900;
  const P2=T0+T1, P3=P2+DEPART, P4=P3+T2, P5=P4+HOLD, P6=P5+T3;
  const target=GEO.tables[targetNo];
  function follow(px,py,w,h){const[vx,vy,vw,vh]=vbOf();
    const nx=px-w/2, ny=py-h/2.1;
    const k=0.12;
    setVB(...clampVB(vx+(nx-vx)*k, vy+(ny-vy)*k, w, h));}
  function frame(now){
    const t=now-start;
    if(t<T0){ setVB(FULL.x,FULL.y,FULL.w,FULL.h); }
    else if(t<P2){ const p=ease((t-T0)/T1);
      const w=FULL.w+(Z.w-FULL.w)*p, h=FULL.h+(Z.h-FULL.h)*p;
      const cx=FULL.x+FULL.w/2+(pts[0][0]-FULL.x-FULL.w/2)*p, cy=FULL.y+FULL.h/2+(pts[0][1]-FULL.y-FULL.h/2)*p;
      setVB(...clampVB(cx-w/2,cy-h/2,w,h));
      dot.setAttribute("opacity",1); dot.setAttribute("cx",pts[0][0]); dot.setAttribute("cy",pts[0][1]); }
    else if(t<P3){ /* 在入口停頓：圓點脈動、路線尚未畫出，與入口箭頭重疊呈現 */
      const k=(t-P2)/DEPART;
      dot.setAttribute("r", 4.6+2*Math.sin(k*Math.PI));
      dot.setAttribute("cx",pts[0][0]); dot.setAttribute("cy",pts[0][1]);
      follow(pts[0][0],pts[0][1],Z.w,Z.h); }
    else if(t<P4){ const p=ease((t-P3)/T2);
      dot.setAttribute("r",4.6);
      const len=L*p, pt=route.getPointAtLength(len);
      route.setAttribute("stroke-dashoffset",L-len);
      dot.setAttribute("cx",pt.x); dot.setAttribute("cy",pt.y);
      follow(pt.x,pt.y,Z.w,Z.h); }
    else if(t<P5){ route.setAttribute("stroke-dashoffset",0);
      const pt=route.getPointAtLength(L); dot.setAttribute("cx",pt.x); dot.setAttribute("cy",pt.y);
      follow(target[0],target[1],Z.w*0.85,Z.h*0.85); }
    else if(t<P6){ const p=ease((t-P5)/T3);
      const[vx,vy,vw,vh]=vbOf();
      const w=vw+(FULL.w-vw)*p, h=vh+(FULL.h-vh)*p;
      const x=vx+(FULL.x-vx)*p, y=vy+(FULL.y-vy)*p;
      setVB(x,y,w,h); }
    else { setVB(FULL.x,FULL.y,FULL.w,FULL.h);
      route.setAttribute("stroke-dasharray","7 5"); route.setAttribute("stroke-dashoffset",0); return; }
    anim.raf=requestAnimationFrame(frame);
  }
  anim.raf=requestAnimationFrame(frame);
}

/* ================= 縮放/拖曳 ================= */
(function(){
  const ptrs=new Map(); let startDist=0,startVB=null,startMid=null;
  const pt=e=>{const r=map.getBoundingClientRect();const[vx,vy,vw,vh]=vbOf();
    return [vx+(e.clientX-r.left)/r.width*vw, vy+(e.clientY-r.top)/r.height*vh];};
  map.addEventListener("pointerdown",e=>{cancelAnimationFrame(anim.raf);map.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId,e);
    if(ptrs.size===2){const[a,b]=[...ptrs.values()];startDist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
      startVB=vbOf();startMid=[(a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2];}
    else{startVB=vbOf();startMid=[e.clientX,e.clientY];}});
  map.addEventListener("pointermove",e=>{
    if(!ptrs.has(e.pointerId))return; ptrs.set(e.pointerId,e);
    const r=map.getBoundingClientRect();
    if(ptrs.size===2){const[a,b]=[...ptrs.values()];
      const dist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
      const scale=Math.min(Math.max(startDist/dist,0.2),5);
      let w=startVB[2]*scale,h=startVB[3]*scale;
      w=Math.min(Math.max(w,FULL.w/5),FULL.w*1.2);h=w*FULL.h/FULL.w;
      const mx=startVB[0]+(startMid[0]-r.left)/r.width*startVB[2];
      const my=startVB[1]+(startMid[1]-r.top)/r.height*startVB[3];
      setVB(...clampVB(mx-w*((startMid[0]-r.left)/r.width), my-h*((startMid[1]-r.top)/r.height), w, h));}
    else if(ptrs.size===1&&startVB){
      const dx=(e.clientX-startMid[0])/r.width*startVB[2];
      const dy=(e.clientY-startMid[1])/r.height*startVB[3];
      setVB(...clampVB(startVB[0]-dx,startVB[1]-dy,startVB[2],startVB[3]));}});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2){startVB=vbOf();const v=[...ptrs.values()][0];if(v)startMid=[v.clientX,v.clientY];}};
  map.addEventListener("pointerup",up);map.addEventListener("pointercancel",up);
  map.addEventListener("dblclick",e=>{const[vx,vy,vw]=vbOf();
    if(vw>FULL.w*0.7){const[mx,my]=pt(e);const w=FULL.w/2.4,h=FULL.h/2.4;setVB(...clampVB(mx-w/2,my-h/2,w,h));}
    else setVB(FULL.x,FULL.y,FULL.w,FULL.h);});
})();

/* ================= UI 流程 ================= */
const $=id=>document.getElementById(id);
const q=$("q"),sugg=$("sugg");
let current=null;
function show(view){$("viewSearch").classList.toggle("active",view==="search");
  $("viewResult").classList.toggle("active",view==="result");window.scrollTo(0,0);}
function render(list){
  sugg.innerHTML="";
  if(!q.value.trim()){sugg.classList.remove("show");return;}
  if(!list.length){sugg.innerHTML='<div class="none">查無資料，請試試其他寫法，或洽入口收禮桌服務人員</div>';}
  else{const h=document.createElement("div");h.className="none";h.style.cssText="padding:9px 16px;font-size:13px";
    h.textContent="請點選您的大名 ↓";sugg.appendChild(h);}
  list.forEach(item=>{
    const b=document.createElement("button");
    b.innerHTML=`<span class="who">${item.name}${item.seats>1?` <span class="badge">×${item.seats}</span>`:""}</span><span class="where">第 ${item.no} 桌 · ${item.tname}</span>`;
    b.onclick=()=>go(item);
    sugg.appendChild(b);});
  sugg.classList.add("show");
}
let autoT=null;
q.addEventListener("input",()=>{
  clearTimeout(autoT);
  const list=search(q.value);
  render(list);
  /* 打完整姓名且唯一命中 → 自動帶位 */
  const nq=norm(q.value);
  const exact=list.filter(r=>r.type==="guest"&&r.tokens&&r.tokens.includes(nq));
  if(nq.length>=2&&exact.length===1&&list.filter(r=>r.type==="guest").length===1)
    autoT=setTimeout(()=>go(exact[0]),600);
});
q.addEventListener("keydown",e=>{if(e.key==="Enter"){const r=search(q.value);if(r.length===1)go(r[0]);}});
function go(item){
  clearTimeout(autoT);
  current=item;
  $("greet").innerHTML=item.type==="table"?`您查詢的是`:`<b>${item.name}</b>　您好，您的座位在`;
  $("tableNo").textContent=item.no===1?"主桌":`第 ${item.no} 桌`;
  $("tableName").textContent=item.tname;
  $("tableName").style.display=item.no===1?"none":"inline-block";
  $("seatInfo").textContent=item.seats>1?`♥ 此桌已為您保留 ${item.seats} 個座位`:"";
  show("result");
  requestAnimationFrame(()=>animateRoute(item.no));
}
$("replayBtn").onclick=()=>current&&animateRoute(current.no,true);
$("backBtn").onclick=()=>{show("search");q.value="";sugg.classList.remove("show");q.focus();};
if(CONFIG.lineUrl&&CONFIG.lineUrl!=="__LINE"+"_URL__"){
  const b=$("lineBtn");b.href=CONFIG.lineUrl;b.style.display="inline-flex";
  const b2=$("lineBtnResult");if(b2){b2.href=CONFIG.lineUrl;b2.style.display="inline-flex";}
}
</script>
