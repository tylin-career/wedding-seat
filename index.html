<style>
:root{

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Noto Sans TC',system-ui,sans-serif;background:var(--cream);color:var(--ink);

.wrap{max-width:520px;margin:0 auto;padding:28px 20px 40px;min-height:100%;display:flex;flex-direction:column}
.serif{font-family:'Noto Serif TC',serif}
/* ---------- landing ---------- */
.hero{text-align:center;margin:8px 0 26px}
.hero .date{letter-spacing:.35em;font-size:13px;color:var(--gold);font-weight:500;text-indent:.35em}
.hero h1{font-size:34px;font-weight:700;color:var(--red-deep);margin:10px 0 6px;letter-spacing:.06em}
.hero h1 .amp{color:var(--gold);font-size:22px;margin:0 10px;font-weight:500}
.hero .venue{font-size:14px;color:var(--muted);letter-spacing:.12em}
.hero .divider{display:flex;align-items:center;gap:12px;margin:18px auto 0;max-width:300px}
.hero .divider::before,.hero .divider::after{content:"";flex:1;height:1px;background:var(--line)}
.hero .divider span{color:var(--gold);font-size:15px}
.lead{text-align:center;font-size:16px;margin:0 0 14px;color:var(--ink);font-weight:500}
.searchbox{position:relative}
.searchbox input{width:100%;font-size:18px;padding:15px 18px 15px 48px;border:1.5px solid var(--line);
  border-radius:14px;background:var(--card);color:var(--ink);outline:none;font-family:inherit;
  box-shadow:0 2px 10px rgba(140,34,56,.05)}
.searchbox input:focus{border-color:var(--gold-soft)}
.searchbox .icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}
.sugg{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:0 6px 20px rgba(61,50,41,.07);display:none}
.sugg.show{display:block}
.sugg button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:13px 16px;
  border:none;background:none;font-family:inherit;font-size:16px;color:var(--ink);cursor:pointer;text-align:left}
.sugg button + button{border-top:1px solid #F3EBDD}
.sugg button:active{background:#FAF3E6}
.sugg .who{font-weight:500}
.sugg .where{font-size:13px;color:var(--muted);white-space:nowrap;margin-left:12px}
.sugg .none{padding:14px 16px;font-size:14px;color:var(--muted)}
.linebar{margin-top:auto;padding-top:30px;text-align:center}
.linebtn{display:inline-flex;align-items:center;gap:8px;background:#06C755;color:#fff;font-weight:500;
  font-size:15px;padding:11px 22px;border-radius:999px;text-decoration:none;box-shadow:0 3px 10px rgba(6,199,85,.25)}
.foot{margin-top:14px;font-size:12px;color:var(--muted);text-align:center;line-height:1.7}
/* ---------- result ---------- */
.back{display:inline-flex;align-items:center;gap:6px;border:none;background:none;color:var(--muted);
  font-size:14px;font-family:inherit;cursor:pointer;padding:4px 0;margin-bottom:6px}
.resCard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px;text-align:center;

.resCard .tableNo{font-size:40px;font-weight:700;color:var(--red-deep);margin:6px 0 2px;letter-spacing:.04em}
.resCard .tableName{display:inline-block;font-size:14px;color:var(--gold);border:1px solid var(--gold-soft);

.resCard .walk{font-size:13px;color:var(--muted);margin-top:10px}
.mapBox{margin-top:14px;background:#FFFDF8;border:1px solid var(--line);border-radius:18px;overflow:hidden;
  box-shadow:0 6px 24px rgba(61,50,41,.07);position:relative}
.mapBox svg{display:block;width:100%;height:auto;touch-action:none;user-select:none}
.maphint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:11px;color:#B5A890;pointer-events:none}
.ctrls{display:flex;gap:10px;margin-top:14px}
.ctrls button{flex:1;font-family:inherit;font-size:15px;font-weight:500;padding:12px 0;border-radius:12px;cursor:pointer}
.btnPrimary{background:var(--red);color:#fff;border:none;box-shadow:0 3px 10px rgba(179,48,74,.25)}
.btnGhost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.7}
.view{display:none}
.view.active{display:flex;flex-direction:column;flex:1}
@media (min-width:560px){ .hero h1{font-size:40px} }
</style>
</head>

  tokens.add(norm(g.replace(/[（(][^（）()]*[）)]/g,"")));
  const colon = g.split(/[:：]/); if(colon.length>1) tokens.add(norm(colon[colon.length-1]));
  GUESTS.push({name:g, no:t.no, tname:t.name, tokens:[...tokens].filter(Boolean)});
}));
function search(qRaw){
  const q = norm(qRaw);
  if(!q) return [];
  const res = [];
  for(const g of GUESTS){
    let best = -1;
    for(const tk of g.tokens){
      if(tk.startsWith(q)) best = Math.max(best, 2);
      else if(tk.includes(q)) best = Math.max(best, 1);
    }
    if(best>0) res.push({type:"guest", score:best, len:g.name.length, ...g});
  }
  for(const t of TABLES){
    if(String(t.no)===q || norm(t.name).includes(q))
      res.push({type:"table", score:3, len:0, no:t.no, tname:t.name, name:"第 "+t.no+" 桌"});
  }
  res.sort((a,b)=> b.score-a.score || a.len-b.len || a.no-b.no);
  return res.slice(0,8);
}

/* ================= Dijkstra 路徑 ================= */
function buildPath(tableNo){
  const ap = GEO.approach[tableNo];
  const C = GEO.corridors;
  const nodeXs = {B:new Set(),M:new Set(),C:new Set(),T:new Set()};
  for(const [a,b,xs] of GEO.links) xs.forEach(x=>{nodeXs[a].add(x); nodeXs[b].add(x);});
  Object.values(GEO.tables) && Object.entries(GEO.approach).forEach(([no,a])=>nodeXs[a.c].add(a.ax));
  nodeXs.B.add(GEO.entrance.x);
  const id=(c,x)=>c+"@"+x, nodes={}, edges={};
  const addEdge=(u,v,w)=>{(edges[u]=edges[u]||[]).push([v,w]);(edges[v]=edges[v]||[]).push([u,w]);};
  for(const c in nodeXs){
    const xs=[...nodeXs[c]].filter(x=>x>=C[c].x0-0.1&&x<=C[c].x1+0.1).sort((a,b)=>a-b);
    xs.forEach((x,i)=>{ nodes[id(c,x)]=[x,C[c].y]; if(i>0) addEdge(id(c,xs[i-1]),id(c,x),(x-xs[i-1])*(GEO.weights[c]||1)); });
  }
  for(const [a,b,xs] of GEO.links) xs.forEach(x=>{ if(nodes[id(a,x)]&&nodes[id(b,x)]) addEdge(id(a,x),id(b,x),Math.abs(C[a].y-C[b].y)); });
  const startId="ENT"; nodes[startId]=[GEO.entrance.x,GEO.entrance.y];
  addEdge(startId,id("B",GEO.entrance.x),GEO.entrance.y-GEO.entrance.joinY);
  const goal=id(ap.c,ap.ax);
  const dist={},prev={},Q=new Set(Object.keys(nodes));
  for(const n of Q) dist[n]=Infinity; dist[startId]=0;
  while(Q.size){
    let u=null,du=Infinity; for(const n of Q) if(dist[n]<du){du=dist[n];u=n;}
    if(u===null||u===goal) break; Q.delete(u);
    for(const [v,w] of (edges[u]||[])) if(Q.has(v)&&du+w<dist[v]){dist[v]=du+w;prev[v]=u;}
  }
  const pts=[]; let cur=goal;
  while(cur){ pts.unshift(nodes[cur]); cur=prev[cur]; }
  ap.tail.forEach(p=>pts.push(p));
  /* 去除共線點 */
  const clean=[pts[0]];
  for(let i=1;i<pts.length-1;i++){
    const [a,b,c]=[clean[clean.length-1],pts[i],pts[i+1]];
    if(Math.abs((b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]))>0.5) clean.push(b);
  }
  clean.push(pts[pts.length-1]);
  return clean;
}
function roundedPathD(pts,r=5){
  if(pts.length<2) return "";
  let d=`M${pts[0][0]} ${pts[0][1]}`;
  for(let i=1;i<pts.length-1;i++){
    const [px,py]=pts[i-1],[cx,cy]=pts[i],[nx,ny]=pts[i+1];
    const v1=[px-cx,py-cy],v2=[nx-cx,ny-cy];
    const l1=Math.hypot(...v1),l2=Math.hypot(...v2);
    const rr=Math.min(r,l1/2,l2/2);
    const p1=[cx+v1[0]/l1*rr,cy+v1[1]/l1*rr],p2=[cx+v2[0]/l2*rr,cy+v2[1]/l2*rr];
    d+=` L${p1[0].toFixed(1)} ${p1[1].toFixed(1)} Q${cx} ${cy} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  const e=pts[pts.length-1];
  d+=` L${e[0]} ${e[1]}`;
  return d;
}

/* ================= 地圖繪製 ================= */
const SVGNS="http://www.w3.org/2000/svg";
const map=document.getElementById("map");
const FULL={x:58,y:245,w:504,h:262};
function el(tag,attrs,parent){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||map).appendChild(e);return e;}
function drawBase(targetNo){
  map.innerHTML="";
  el("path",{d:GEO.wall,fill:"#FFFCF5",stroke:"#A8967C","stroke-width":1.6,"stroke-linejoin":"round"});
  const [cx,cy,cw,ch]=GEO.carpet;
  el("rect",{x:cx,y:cy,width:cw,height:ch,rx:2,fill:"#E3A6A6",opacity:.6});
  const [sx,sy,sw,sh]=GEO.stage;
  el("rect",{x:sx,y:sy,width:sw,height:sh,rx:3,fill:"#F0E3C6",stroke:"#C9B896","stroke-width":1});
  el("text",{x:sx+sw/2,y:sy+sh/2,"text-anchor":"middle","dominant-baseline":"central",
    "font-size":9,fill:"#8C7F70","writing-mode":"tb",style:"letter-spacing:3px"}).textContent="舞台";
  GEO.equip.forEach(([x,y])=>el("rect",{x,y,width:18.5,height:12.6,rx:1.5,fill:"#E6DAC4"}));
  GEO.screens.forEach(([x1,x2])=>el("line",{x1,y1:459.5,x2,y2:459.5,stroke:"#B5A890","stroke-width":3}));
  /* 入口 */
  el("rect",{x:138,y:457.5,width:24,height:5,fill:"#FBF6EE"});
  el("path",{d:"M150 470 L150 452 M144 458 L150 451 L156 458",stroke:"#B3304A","stroke-width":2,fill:"none","stroke-linecap":"round","stroke-linejoin":"round"});
  el("text",{x:150,y:481,"text-anchor":"middle","font-size":10,fill:"#B3304A","font-weight":"700"}).textContent="入口";
  el("text",{x:208,y:481,"text-anchor":"middle","font-size":8.5,fill:"#B5A890"}).textContent="收禮桌";
  el("rect",{x:188,y:470,width:40,height:5,rx:2,fill:"none",stroke:"#CFC2A8","stroke-width":.8});
  /* 桌子 */
  for(const no in GEO.tables){
    const [x,y,r]=GEO.tables[no];
    const isMain=no==="1", isTarget=+no===targetNo;
    const g=el("g",{});
    el("circle",{cx:x,cy:y,r,fill:isTarget?"#B98A2F":(isMain?"#C8536B":"#F4EAD7"),
      stroke:isTarget?"#8a6517":(isMain?"#A23B52":"#CDBC9D"),"stroke-width":isTarget?1.5:1},g);
    el("text",{x,y:y+.5,"text-anchor":"middle","dominant-baseline":"central",
      "font-size":isMain?8.5:9.5,"font-weight":"700",
      fill:(isTarget||isMain)?"#fff":"#6B5B45"},g).textContent=isMain?"主桌":no;
    if(isTarget){
      const ring=el("circle",{cx:x,cy:y,r:r+3,fill:"none",stroke:"#B98A2F","stroke-width":1.6,opacity:.9},g);
      const a1=el("animate",{attributeName:"r",values:`${r+2};${r+9}`,dur:"1.5s",repeatCount:"indefinite"},ring);
      el("animate",{attributeName:"opacity",values:"0.85;0",dur:"1.5s",repeatCount:"indefinite"},ring);
    }
  }
  /* Ballroom 淡標示 */
  el("text",{x:200,y:268,"font-size":8,fill:"#CFC2A8","text-anchor":"middle",style:"letter-spacing:2px"}).textContent="BALLROOM I";
  el("text",{x:430,y:272,"font-size":8,fill:"#CFC2A8","text-anchor":"middle",style:"letter-spacing:2px"}).textContent="BALLROOM II";
}

/* ================= 動畫 ================= */
let anim={raf:0};
const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
function setVB(x,y,w,h){map.setAttribute("viewBox",`${x} ${y} ${w} ${h}`);}
function vbOf(){return map.getAttribute("viewBox").split(" ").map(Number);}
const clampVB=(x,y,w,h)=>{
  x=Math.min(Math.max(x,FULL.x-10),FULL.x+FULL.w-w+10);
  y=Math.min(Math.max(y,FULL.y-10),FULL.y+FULL.h-h+10);
  return [x,y,w,h];
};
const ease=t=>t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function animateRoute(targetNo){
  cancelAnimationFrame(anim.raf);
  drawBase(targetNo);
  const pts=buildPath(targetNo);
  const d=roundedPathD(pts);
  const route=el("path",{d,fill:"none",stroke:"#B3304A","stroke-width":3.2,
    "stroke-linecap":"round","stroke-linejoin":"round","stroke-dasharray":"7 5",opacity:.95});
  const dot=el("circle",{r:4.6,fill:"#B3304A",stroke:"#fff","stroke-width":1.8,opacity:0});
  const L=route.getTotalLength();
  document.getElementById("walkInfo").textContent=
    `自入口步行約 ${Math.max(5,Math.round(L*CONFIG.mPerPt))} 公尺`;
  if(reduceMotion){ setVB(FULL.x,FULL.y,FULL.w,FULL.h); dot.setAttribute("opacity",1);
    const p=route.getPointAtLength(L); dot.setAttribute("cx",p.x); dot.setAttribute("cy",p.y); return; }
  route.setAttribute("stroke-dashoffset",L); route.setAttribute("stroke-dasharray",`${L} ${L}`);
  const Z={w:230,h:230*FULL.h/FULL.w};
  const start=performance.now();
  const T0=700, T1=900, T2=Math.min(7000,Math.max(3800,L*14)), T3=900, T4=700, HOLD=900;
  const target=GEO.tables[targetNo];
  function follow(px,py,w,h){const[vx,vy,vw,vh]=vbOf();
    const nx=px-w/2, ny=py-h/2.1;
    const k=0.12;
    setVB(...clampVB(vx+(nx-vx)*k, vy+(ny-vy)*k, w, h));}
  function frame(now){
    const t=now-start;
    if(t<T0){ setVB(FULL.x,FULL.y,FULL.w,FULL.h); }
    else if(t<T0+T1){ const p=ease((t-T0)/T1);
      const w=FULL.w+(Z.w-FULL.w)*p, h=FULL.h+(Z.h-FULL.h)*p;
      const cx=FULL.x+FULL.w/2+(pts[0][0]-FULL.x-FULL.w/2)*p, cy=FULL.y+FULL.h/2+(pts[0][1]-FULL.y-FULL.h/2)*p;
      setVB(...clampVB(cx-w/2,cy-h/2,w,h));
      dot.setAttribute("opacity",1); dot.setAttribute("cx",pts[0][0]); dot.setAttribute("cy",pts[0][1]); }
    else if(t<T0+T1+T2){ const p=ease((t-T0-T1)/T2);
      const len=L*p, pt=route.getPointAtLength(len);
      route.setAttribute("stroke-dashoffset",L-len);
      dot.setAttribute("cx",pt.x); dot.setAttribute("cy",pt.y);
      follow(pt.x,pt.y,Z.w,Z.h); }
    else if(t<T0+T1+T2+HOLD){ route.setAttribute("stroke-dashoffset",0);
      const pt=route.getPointAtLength(L); dot.setAttribute("cx",pt.x); dot.setAttribute("cy",pt.y);
      follow(target[0],target[1],Z.w*0.85,Z.h*0.85); }
    else if(t<T0+T1+T2+HOLD+T3){ const p=ease((t-T0-T1-T2-HOLD)/T3);
      const[vx,vy,vw,vh]=vbOf();
      const w=vw+(FULL.w-vw)*p, h=vh+(FULL.h-vh)*p;
      const x=vx+(FULL.x-vx)*p, y=vy+(FULL.y-vy)*p;
      setVB(x,y,w,h); }
    else { setVB(FULL.x,FULL.y,FULL.w,FULL.h);
      route.setAttribute("stroke-dasharray","7 5"); route.setAttribute("stroke-dashoffset",0); return; }
    anim.raf=requestAnimationFrame(frame);
  }
  anim.raf=requestAnimationFrame(frame);
}

/* ================= 縮放/拖曳 ================= */
(function(){
  const ptrs=new Map(); let startDist=0,startVB=null,startMid=null;
  const pt=e=>{const r=map.getBoundingClientRect();const[vx,vy,vw,vh]=vbOf();
    return [vx+(e.clientX-r.left)/r.width*vw, vy+(e.clientY-r.top)/r.height*vh];};
  map.addEventListener("pointerdown",e=>{cancelAnimationFrame(anim.raf);map.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId,e);
    if(ptrs.size===2){const[a,b]=[...ptrs.values()];startDist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
      startVB=vbOf();startMid=[(a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2];}
    else{startVB=vbOf();startMid=[e.clientX,e.clientY];}});
  map.addEventListener("pointermove",e=>{
    if(!ptrs.has(e.pointerId))return; ptrs.set(e.pointerId,e);
    const r=map.getBoundingClientRect();
    if(ptrs.size===2){const[a,b]=[...ptrs.values()];
      const dist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
      const scale=Math.min(Math.max(startDist/dist,0.2),5);
      let w=startVB[2]*scale,h=startVB[3]*scale;
      w=Math.min(Math.max(w,FULL.w/5),FULL.w*1.2);h=w*FULL.h/FULL.w;
      const mx=startVB[0]+(startMid[0]-r.left)/r.width*startVB[2];
      const my=startVB[1]+(startMid[1]-r.top)/r.height*startVB[3];
      setVB(...clampVB(mx-w*((startMid[0]-r.left)/r.width), my-h*((startMid[1]-r.top)/r.height), w, h));}
    else if(ptrs.size===1&&startVB){
      const dx=(e.clientX-startMid[0])/r.width*startVB[2];
      const dy=(e.clientY-startMid[1])/r.height*startVB[3];
      setVB(...clampVB(startVB[0]-dx,startVB[1]-dy,startVB[2],startVB[3]));}});
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2){startVB=vbOf();const v=[...ptrs.values()][0];if(v)startMid=[v.clientX,v.clientY];}};
  map.addEventListener("pointerup",up);map.addEventListener("pointercancel",up);
  map.addEventListener("dblclick",e=>{const[vx,vy,vw]=vbOf();
    if(vw>FULL.w*0.7){const[mx,my]=pt(e);const w=FULL.w/2.4,h=FULL.h/2.4;setVB(...clampVB(mx-w/2,my-h/2,w,h));}
    else setVB(FULL.x,FULL.y,FULL.w,FULL.h);});
})();

/* ================= UI 流程 ================= */
const $=id=>document.getElementById(id);
const q=$("q"),sugg=$("sugg");
let current=null;
function show(view){$("viewSearch").classList.toggle("active",view==="search");
  $("viewResult").classList.toggle("active",view==="result");window.scrollTo(0,0);}
function render(list){
  sugg.innerHTML="";
  if(!q.value.trim()){sugg.classList.remove("show");return;}
  if(!list.length){sugg.innerHTML='<div class="none">查無資料，請試試其他寫法，或洽入口收禮桌服務人員</div>';}
  else{const h=document.createElement("div");h.className="none";h.style.cssText="padding:9px 16px;font-size:13px";
    h.textContent="請點選您的大名 ↓";sugg.appendChild(h);}
  list.forEach(item=>{
    const b=document.createElement("button");
    b.innerHTML=`<span class="who">${item.name}</span><span class="where">第 ${item.no} 桌 · ${item.tname}</span>`;
    b.onclick=()=>go(item);
    sugg.appendChild(b);});
  sugg.classList.add("show");
}
let autoT=null;
q.addEventListener("input",()=>{
  clearTimeout(autoT);
  const list=search(q.value);
  render(list);
  /* 打完整姓名且唯一命中 → 自動帶位 */
  const nq=norm(q.value);
  const exact=list.filter(r=>r.type==="guest"&&r.tokens&&r.tokens.includes(nq));
  if(nq.length>=2&&exact.length===1&&list.filter(r=>r.type==="guest").length===1)
    autoT=setTimeout(()=>go(exact[0]),600);
});
q.addEventListener("keydown",e=>{if(e.key==="Enter"){const r=search(q.value);if(r.length===1)go(r[0]);}});
function go(item){
  clearTimeout(autoT);
  current=item;
  $("greet").innerHTML=item.type==="table"?`您查詢的是`:`<b>${item.name}</b>　您好，您的座位在`;
  $("tableNo").textContent=item.no===1?"主桌":`第 ${item.no} 桌`;
  $("tableName").textContent=item.tname;
  $("tableName").style.display=item.no===1?"none":"inline-block";
  show("result");
  requestAnimationFrame(()=>animateRoute(item.no));
}
$("backBtn").onclick=()=>{show("search");q.value="";sugg.classList.remove("show");q.focus();};
$("replayBtn").onclick=()=>current&&animateRoute(current.no);
$("fullBtn").onclick=()=>{cancelAnimationFrame(anim.raf);setVB(FULL.x,FULL.y,FULL.w,FULL.h);};
if(CONFIG.lineUrl&&CONFIG.lineUrl!=="__LINE"+"_URL__"){const b=$("lineBtn");b.href=CONFIG.lineUrl;b.style.display="inline-flex";}
</script>
